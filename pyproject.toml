[build-system]
requires = ["hatchling>=1.27.0", "setuptools>=68", "cffi>=1.17.0"]
build-backend = "hatchling.build"

[project]
name = "py-fn-dsa"
version = "0.1.0"
description = "Python bindings for c-fn-dsa"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Koji KITAYAMA" }
]
requires-python = ">=3.10"
keywords=["fndsa","post-quantum","cryptography"]
classifiers=[
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "cffi>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build]
artifacts = [
    "src/py_fn_dsa/_c_fn_dsa.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py_fn_dsa"]

[tool.hatch.build.hooks.custom]
path = "build.py"

[project.urls]
Repository = "https://github.com/kkitayam/py-fn-dsa"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.cibuildwheel]
build-verbosity = 1
skip = "pp* *-musllinux_*"
test-command = "pytest {project}/tests"
